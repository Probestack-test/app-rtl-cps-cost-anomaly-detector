openapi: 3.1.0
info:
  title: Cost Anomaly Detector
  description: "Real-time cloud cost anomaly detection and forensics platform. Detects\
    \  unexpected spend spikes within minutes (not at end-of-month billing) by  analyzing\
    \ usage patterns across every AWS, GCP, and Azure service. Uses  ML-based baselines,\
    \ seasonal patterns, and business context to distinguish  real anomalies from\
    \ expected events (Black Friday, product launches).  Provides root-cause attribution\
    \ — which resource, which team, which change  caused the spike. Enables engineers\
    \ to act before a $500/day misconfiguration  becomes a $50,000 monthly bill. "
  termsOfService: https://forgesphere.example.com/terms
  contact:
    name: ForgeSphere FinOps Team
    email: finops@forgesphere.example.com
  version: 1.0.0
servers:
- url: http://127.0.0.1:18080
  description: Generated server url
tags:
- name: Anomalies
  description: "Detect, list, and analyze cost anomalies."
- name: Actions
  description: "Acknowledge, suppress, or investigate anomalies."
paths:
  /actuator/health:
    get:
      tags:
      - Health
      summary: Health
      operationId: getHealth
      responses:
        "200":
          description: Monitoring data returned successfully
          content:
            application/json:
              schema:
                type: object
  /actuator/health/liveness:
    get:
      tags:
      - Health
      summary: Liveness
      operationId: getLiveness
      responses:
        "200":
          description: Monitoring data returned successfully
          content:
            application/json:
              schema:
                type: object
  /actuator/health/readiness:
    get:
      tags:
      - Health
      summary: Readiness
      operationId: getReadiness
      responses:
        "200":
          description: Monitoring data returned successfully
          content:
            application/json:
              schema:
                type: object
  /actuator/metrics:
    get:
      tags:
      - Health
      summary: Metrics
      operationId: getMetrics
      responses:
        "200":
          description: Monitoring data returned successfully
          content:
            application/json:
              schema:
                type: object
  /actuator/prometheus:
    get:
      tags:
      - Health
      summary: Prometheus
      operationId: getPrometheusMetrics
      responses:
        "200":
          description: Prometheus metrics returned successfully
          content:
            text/plain:
              schema:
                type: string
  /oauth2/token:
    post:
      tags:
      - Security
      summary: Get OAuth2 Token
      description: Uses the OAuth 2.0 client credentials grant. Authenticate the client
        with HTTP Basic credentials and submit grant_type=client_credentials.
      operationId: getOAuth2Token
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  default: client_credentials
                  description: OAuth 2.0 grant type
                  enum:
                  - client_credentials
                scope:
                  type: string
                  description: Space-delimited scopes
                  example: api.read api.write
              required:
              - grant_type
        required: true
      responses:
        "200":
          description: Access token issued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    format: int32
                    example: 3600
                  scope:
                    type: string
                    example: api.read api.write
        "400":
          description: Invalid token request
        "401":
          description: Invalid client credentials
  /v1/scans:
    post:
      tags:
      - Anomalies
      summary: Trigger an on-demand cost anomaly detection scan
      description: "Runs an immediate anomaly detection scan over a specified time\
        \ window.  Normally scans run automatically every 15 minutes, but this endpoint\
        \  forces an ad-hoc scan — useful after a known deployment, during  incident\
        \ investigation, or before a sales event. Compares current  spend against\
        \ ML-based seasonal baselines and flags deviations above  the threshold. "
      operationId: triggerScan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerScanRequest"
        required: true
      responses:
        "202":
          description: Scan accepted and starting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionScan"
        "400":
          description: Invalid request payload or parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Scan quota exceeded for this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /v1/anomalies/{anomalyId}/action:
    post:
      tags:
      - Actions
      summary: "Acknowledge, investigate, resolve, or suppress an anomaly"
      description: "Updates the lifecycle state of an anomaly. Actions: ACKNOWLEDGE\
        \ (seen,  no action yet), INVESTIGATE (assigned to an engineer), RESOLVE (fixed,\
        \  with resolution notes), SUPPRESS (known/expected, future similar  alerts\
        \ muted), FALSE_POSITIVE (model was wrong). Every action is  audit-logged\
        \ and feeds the ML model to reduce future false positives. "
      operationId: takeAnomalyAction
      parameters:
      - name: anomalyId
        in: path
        description: Unique identifier of the anomaly.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnomalyActionRequest"
        required: true
      responses:
        "200":
          description: Action recorded and anomaly state updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anomaly"
        "400":
          description: Invalid request payload or parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Scan or anomaly not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Anomaly is not in a state that supports this action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /v1/scans/{scanId}:
    get:
      tags:
      - Anomalies
      summary: Get the status and results of a detection scan
      description: "Returns the current state of a scan — progress, anomalies detected,\
        \  total spend in the window, and overall spend delta. Poll this endpoint\
        \  until status = COMPLETED to get the full anomaly list. "
      operationId: getScan
      parameters:
      - name: scanId
        in: path
        description: Unique identifier of the scan.
        required: true
        schema:
          type: string
          format: uuid
      - name: includeAnomalies
        in: query
        description: Include the full anomaly list in the response.
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: Scan status and results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionScan"
        "401":
          description: Missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Scan or anomaly not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /v1/anomalies:
    get:
      tags:
      - Anomalies
      summary: List detected cost anomalies
      description: "Returns all cost anomalies detected across the organization. Supports\
        \  filtering by severity, cloud provider, service, team, and time window.\
        \  Sortable by cost impact, discovery time, or confidence. This is the  primary\
        \ \"morning coffee\" view for FinOps teams and engineering leaders. "
      operationId: listAnomalies
      parameters:
      - name: severity
        in: query
        description: Filter by anomaly severity.
        required: false
        schema:
          type: string
      - name: cloudProvider
        in: query
        description: Filter by cloud provider.
        required: false
        schema:
          type: string
      - name: service
        in: query
        description: "Filter by cloud service (e.g., compute, database)."
        required: false
        schema:
          type: string
      - name: team
        in: query
        description: Filter by owning team.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter by anomaly status.
        required: false
        schema:
          type: string
      - name: fromDate
        in: query
        description: Only include anomalies detected after this time.
        required: false
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        description: Only include anomalies detected before this time.
        required: false
        schema:
          type: string
          format: date-time
      - name: minCostImpactUSD
        in: query
        description: Only include anomalies with cost impact above this.
        required: false
        schema:
          type: number
          format: double
          minimum: 0.0
      - name: sortBy
        in: query
        description: Sort order.
        required: false
        schema:
          type: string
          default: COST_IMPACT
      - name: page
        in: query
        description: Page number (zero-based).
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: Number of items per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: Paginated list of cost anomalies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyList"
        "400":
          description: Invalid request payload or parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /v1/anomalies/{anomalyId}:
    get:
      tags:
      - Anomalies
      summary: Get detailed root-cause analysis of a cost anomaly
      description: "Returns the full analysis of a single anomaly — including resource-level\
        \  breakdown, affected services, probable root cause (deployment, config \
        \ change, traffic surge), attribution to team/cost center, and  recommended\
        \ remediation. Includes historical baseline vs actual spend  chart data. "
      operationId: getAnomaly
      parameters:
      - name: anomalyId
        in: path
        description: Unique identifier of the anomaly.
        required: true
        schema:
          type: string
          format: uuid
      - name: includeTimeline
        in: query
        description: Include hourly spend timeline for the anomaly window.
        required: false
        schema:
          type: boolean
          default: true
      - name: includeRelatedChanges
        in: query
        description: Include correlated deployments and config changes.
        required: false
        schema:
          type: boolean
          default: true
      responses:
        "200":
          description: Anomaly details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anomaly"
        "401":
          description: Missing or invalid authentication token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Scan or anomaly not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    Anomaly:
      type: object
      properties:
        anomalyId:
          type: string
          format: uuid
          description: Unique identifier of the anomaly.
          example: 456e7890-e89b-12d3-a456-426614174001
        scanId:
          type: string
          format: uuid
          description: Scan that detected this anomaly.
          example: 123e4567-e89b-12d3-a456-426614174000
        title:
          type: string
          description: Human-readable summary of the anomaly.
          example: AWS Lambda spend spiked 340% — likely runaway recursion
        description:
          type: string
          description: Detailed description.
          example: "Lambda invocation count jumped from 120K to 12M/hour, costing\
            \ $84/hour vs expected $8/hour."
        severity:
          type: string
          description: Anomaly severity based on cost impact.
          enum:
          - INFO
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          example: CRITICAL
        status:
          type: string
          description: Lifecycle state.
          enum:
          - OPEN
          - ACKNOWLEDGED
          - INVESTIGATING
          - RESOLVED
          - SUPPRESSED
          - FALSE_POSITIVE
          example: OPEN
        cloudProvider:
          type: string
          description: Cloud provider.
          enum:
          - AWS
          - GCP
          - AZURE
          example: AWS
        service:
          type: string
          description: Cloud service category.
          example: compute
        serviceDetail:
          type: string
          description: "Specific service (e.g., 'Lambda', 'EC2', 'RDS')."
          example: Lambda
        region:
          type: string
          description: Cloud region.
          example: us-east-1
        detectedAt:
          type: string
          format: date-time
          description: When the anomaly was first detected.
          example: 2026-11-24T08:15Z
        anomalyWindowStart:
          type: string
          format: date-time
          example: 2026-11-24T07:00Z
        anomalyWindowEnd:
          type: string
          format: date-time
          example: 2026-11-24T08:00Z
        costImpact:
          $ref: "#/components/schemas/AnomalyCostImpact"
        percentDeviation:
          type: number
          format: double
          description: Percent above baseline.
          example: 340.0
        confidence:
          type: number
          format: double
          description: ML model confidence that this is a real anomaly (not normal
            fluctuation).
          example: 0.96
          maximum: 1
          minimum: 0
        attribution:
          $ref: "#/components/schemas/Anomaly_attribution"
        probableRootCause:
          $ref: "#/components/schemas/AnomalyProbableRootCause"
        relatedChanges:
          type: array
          description: "Deployments, config changes, or incidents in the anomaly window."
          items:
            $ref: "#/components/schemas/AnomalyRelatedChangesInner"
        spendTimeline:
          type: array
          description: Hourly spend data (if includeTimeline=true).
          items:
            $ref: "#/components/schemas/AnomalySpendTimelineInner"
        recommendedActions:
          type: array
          description: Concrete remediation suggestions from the anomaly model.
          example:
          - Throttle Lambda concurrent executions to 100 (currently unlimited).
          - Fix S3 bucket lifecycle policy to prevent recursive writes.
          - Add CloudWatch alarm for invocation count > 1M/hour.
          items:
            type: string
        assignedTo:
          type: string
          example: payments-engineer@forgesphere.example.com
        acknowledgedAt:
          type: string
          format: date-time
        acknowledgedBy:
          type: string
          example: oncall@forgesphere.example.com
        resolvedAt:
          type: string
          format: date-time
        resolvedBy:
          type: string
        resolutionType:
          type: string
          enum:
          - CONFIGURATION_FIX
          - CODE_FIX
          - RESOURCE_TERMINATION
          - SCALING_CHANGE
          - THROTTLING_ADDED
          - NO_ACTION_NEEDED
          - FALSE_POSITIVE
          example: THROTTLING_ADDED
        actualCostImpactUSD:
          type: number
          format: double
          description: Realized cost impact after resolution.
          example: 12450.0
        aiSummary:
          type: string
          description: AI-generated plain-English summary.
          example: "CRITICAL: AWS Lambda spend spiked 340% ($168/hr vs $38/hr baseline).\
            \ Root cause: recursive S3 trigger; 12M invocations/hour vs 120K normal.\
            \ Projected monthly cost if unfixed: $62,000. Deploy at 07:05 UTC is likely\
            \ trigger. Recommend: throttle concurrency + fix S3 lifecycle."
        auditReference:
          type: string
          example: audit://cost-anomaly/anomaly-456e7890
      required:
      - anomalyId
      - cloudProvider
      - confidence
      - costImpact
      - detectedAt
      - percentDeviation
      - scanId
      - service
      - severity
      - status
      - title
    AnomalyCostImpact:
      type: object
      properties:
        actualCostUSD:
          type: number
          format: double
          description: Actual spend during the anomaly window.
          example: 168.0
        expectedCostUSD:
          type: number
          format: double
          description: ML-predicted baseline.
          example: 38.2
        deviationUSD:
          type: number
          format: double
          example: 129.8
        deviationPercent:
          type: number
          format: double
          example: 340.0
        projectedMonthlyCostUSD:
          type: number
          format: double
          description: Extrapolated monthly cost if anomaly continues.
          example: 62000.0
      required:
      - actualCostUSD
      - deviationPercent
      - deviationUSD
      - expectedCostUSD
      - projectedMonthlyCostUSD
    AnomalyProbableRootCause:
      type: object
      properties:
        category:
          type: string
          enum:
          - MISCONFIGURATION
          - CODE_DEPLOY
          - TRAFFIC_SPIKE
          - RESOURCE_LEAK
          - STORAGE_LEAK
          - CROSS_REGION_TRANSFER
          - RECURSION
          - EXPIRED_RESERVATION
          - SPOT_INTERRUPTION
          - ATTACK
          - UNKNOWN
          example: RECURSION
        description:
          type: string
          example: Lambda function likely stuck in recursive S3 trigger loop; invocation
            count 100x normal.
        confidence:
          type: number
          format: double
          example: 0.89
        evidence:
          type: array
          example:
          - "Invocation count: 120K/hr → 12M/hr"
          - "Duration: 45ms avg unchanged"
          - "Trigger source: S3 event on same bucket function writes to"
          items:
            type: string
    AnomalyRelatedChangesInner:
      type: object
      properties:
        changeType:
          type: string
          enum:
          - DEPLOYMENT
          - CONFIG_CHANGE
          - INCIDENT
          - INFRASTRUCTURE_CHANGE
          - FEATURE_FLAG_TOGGLE
          example: DEPLOYMENT
        changeId:
          type: string
          example: deploy-abc123
        occurredAt:
          type: string
          format: date-time
          example: 2026-11-24T07:05Z
        correlationConfidence:
          type: number
          format: double
          description: How likely this change caused the anomaly.
          example: 0.92
        summary:
          type: string
          example: payments-team deployed v2.5.0 to Lambda authorizer function.
    AnomalySpendTimelineInner:
      type: object
      properties:
        hour:
          type: string
          format: date-time
          example: 2026-11-24T07:00Z
        actualCostUSD:
          type: number
          format: double
          example: 168.0
        expectedCostUSD:
          type: number
          format: double
          example: 38.2
    Anomaly_attribution:
      type: object
      description: Who/what caused this anomaly.
      properties:
        team:
          type: string
          example: payments-team
        costCenter:
          type: string
          example: CC-PAYMENTS-001
        application:
          type: string
          example: payment-processor
        environment:
          type: string
          enum:
          - DEV
          - STAGING
          - PRODUCTION
          example: PRODUCTION
        resourceIds:
          type: array
          description: Specific resources involved.
          example:
          - arn:aws:lambda:us-east-1:123:function:payment-processor-authorize
          items:
            type: string
        trafficChange:
          type: string
          description: "If driven by traffic, what happened."
          example: "10,000% increase in invocation count"
    DetectionScan:
      type: object
      properties:
        scanId:
          type: string
          format: uuid
          description: Unique identifier of the scan.
          example: 123e4567-e89b-12d3-a456-426614174000
        status:
          type: string
          description: Current scan state.
          enum:
          - QUEUED
          - FETCHING_BILLING_DATA
          - BUILDING_BASELINES
          - DETECTING
          - ANALYZING
          - COMPLETED
          - FAILED
          example: COMPLETED
        cloudProviders:
          type: array
          example:
          - AWS
          - GCP
          items:
            type: string
            enum:
            - AWS
            - GCP
            - AZURE
        lookbackHours:
          type: integer
          format: int32
          description: How far back the scan analyzed.
          example: 6
          maximum: 168
          minimum: 1
        sensitivityLevel:
          type: string
          description: Detection sensitivity — higher catches more but more false
            positives.
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          example: MEDIUM
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
          format: int32
          example: 42
        anomaliesDetected:
          type: integer
          format: int32
          description: Number of anomalies flagged.
          example: 3
        summary:
          $ref: "#/components/schemas/DetectionScanSummary"
        anomalies:
          type: array
          description: Full anomaly list (if includeAnomalies=true).
          items:
            $ref: "#/components/schemas/Anomaly"
        errorMessage:
          type: string
          description: Populated if status = FAILED.
      required:
      - anomaliesDetected
      - cloudProviders
      - lookbackHours
      - scanId
      - startedAt
      - status
      - summary
    DetectionScanSummary:
      type: object
      properties:
        totalSpendInWindowUSD:
          type: number
          format: double
          description: Total cloud spend in the scan window.
          example: 18420.5
        expectedSpendUSD:
          type: number
          format: double
          description: ML-predicted baseline spend.
          example: 12450.0
        actualDeviationUSD:
          type: number
          format: double
          description: Difference from baseline.
          example: 5970.5
        actualDeviationPercent:
          type: number
          format: double
          description: Deviation as a percentage.
          example: 48.0
      required:
      - actualDeviationPercent
      - actualDeviationUSD
      - expectedSpendUSD
      - totalSpendInWindowUSD
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status code.
          example: 400
        errorCode:
          type: string
          description: Application-specific error code.
          example: INVALID_SCAN_WINDOW
        message:
          type: string
          description: Human-readable error message.
          example: lookbackHours must be between 1 and 168.
        timestamp:
          type: string
          format: date-time
          example: 2026-11-24T10:30Z
        path:
          type: string
          description: API path where error occurred.
          example: /v1/scans
        serviceTransactionId:
          type: string
          description: Trace ID for debugging.
          example: 523f52b2-64a5-465e-b245-3efbe78f70ae
      required:
      - message
      - path
      - status
      - timestamp
    TriggerScanRequest:
      type: object
      properties:
        cloudProviders:
          type: array
          description: Clouds to scan.
          example:
          - AWS
          - GCP
          items:
            type: string
            enum:
            - AWS
            - GCP
            - AZURE
          maxItems: 2147483647
          minItems: 1
        lookbackHours:
          type: integer
          format: int32
          description: How far back to analyze (1-168 hours).
          example: 6
          maximum: 168
          minimum: 1
        sensitivityLevel:
          type: string
          description: Detection sensitivity.
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          example: MEDIUM
        includeServices:
          type: array
          description: Service categories to include (empty = all).
          example:
          - compute
          - database
          - storage
          - network
          items:
            type: string
            enum:
            - compute
            - database
            - storage
            - network
            - ai_ml
            - analytics
            - messaging
            - other
        excludeExpectedEvents:
          type: boolean
          description: "Whether to suppress anomalies matching known events (Black\
            \ Friday, launches)."
          example: true
        correlationWindowMinutes:
          type: integer
          format: int32
          description: "How far to look for correlated changes (deploys, incidents)."
          example: 30
          maximum: 120
          minimum: 0
        minCostImpactUSD:
          type: number
          format: double
          description: Ignore anomalies below this USD impact.
          example: 10.0
          minimum: 0
      required:
      - cloudProviders
      - lookbackHours
      - sensitivityLevel
    AnomalyActionRequest:
      type: object
      properties:
        action:
          type: string
          description: Action to perform.
          enum:
          - ACKNOWLEDGE
          - INVESTIGATE
          - RESOLVE
          - SUPPRESS
          - FALSE_POSITIVE
          - REOPEN
          example: RESOLVE
        reason:
          type: string
          description: Justification (min 15 chars).
          example: Stopped runaway Lambda recursion; deployed fix via feature flag.
          maxLength: 2147483647
          minLength: 15
        performedBy:
          type: string
          format: email
          description: Who is performing the action.
          example: payments-engineer@forgesphere.example.com
        assignedTo:
          type: string
          format: email
          description: Required when action = INVESTIGATE.
          example: payments-engineer@forgesphere.example.com
        resolutionType:
          type: string
          description: Required when action = RESOLVE.
          enum:
          - CONFIGURATION_FIX
          - CODE_FIX
          - RESOURCE_TERMINATION
          - SCALING_CHANGE
          - THROTTLING_ADDED
          - NO_ACTION_NEEDED
          - FALSE_POSITIVE
          example: THROTTLING_ADDED
        actualCostImpactUSD:
          type: number
          format: double
          description: Realized cost impact (required when action = RESOLVE).
          example: 12450.0
        preventRecurrence:
          type: string
          description: What was done to prevent recurrence (required when action =
            RESOLVE).
          example: Added rate limit on Lambda invocation; S3 lifecycle policy updated.
        suppressionRule:
          $ref: "#/components/schemas/AnomalyActionRequest_suppressionRule"
      required:
      - action
      - performedBy
      - reason
    AnomalyActionRequest_suppressionRule:
      type: object
      description: Required when action = SUPPRESS. Mutes future similar anomalies.
      properties:
        matchService:
          type: boolean
          example: true
        matchResourceIds:
          type: array
          example:
          - arn:aws:lambda:us-east-1:123:function:test-*
          items:
            type: string
        matchTag:
          type: object
          additionalProperties:
            type: string
          example:
            purpose: load-testing
        expiresAt:
          type: string
          format: date-time
          description: Suppression expires automatically.
          example: 2026-12-31T23:59:59Z
    AnomalyList:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Anomaly"
        page:
          type: integer
          format: int32
          example: 0
          minimum: 0
        size:
          type: integer
          format: int32
          example: 20
          minimum: 1
        totalElements:
          type: integer
          format: int32
          example: 47
          minimum: 0
        totalPages:
          type: integer
          format: int32
          example: 3
          minimum: 0
        summary:
          $ref: "#/components/schemas/AnomalyList_summary"
      required:
      - content
      - page
      - size
      - totalElements
      - totalPages
    AnomalyList_summary:
      type: object
      description: Aggregate metrics for the current filter.
      properties:
        totalAnomalies:
          type: integer
          format: int32
          example: 47
        open:
          type: integer
          format: int32
          example: 12
        acknowledged:
          type: integer
          format: int32
          example: 8
        investigating:
          type: integer
          format: int32
          example: 5
        resolved:
          type: integer
          format: int32
          example: 22
        totalCostImpactUSD:
          type: number
          format: double
          example: 28450.0
        projectedMonthlyImpactUSD:
          type: number
          format: double
          description: If all open anomalies persist for a month.
          example: 124500.0
        topProvider:
          type: string
          example: AWS
        topService:
          type: string
          example: compute
  securitySchemes:
    bearerAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            api.read: Read access to the API
            api.write: Write access to the API
