openapi: 3.0.3
info:
  contact:
    email: finops@forgesphere.example.com
    name: ForgeSphere FinOps Team
  description: "Real-time cloud cost anomaly detection and forensics platform. Detects\
    \ \nunexpected spend spikes within minutes (not at end-of-month billing) by \n\
    analyzing usage patterns across every AWS, GCP, and Azure service. Uses \nML-based\
    \ baselines, seasonal patterns, and business context to distinguish \nreal anomalies\
    \ from expected events (Black Friday, product launches). \nProvides root-cause\
    \ attribution — which resource, which team, which change \ncaused the spike. Enables\
    \ engineers to act before a $500/day misconfiguration \nbecomes a $50,000 monthly\
    \ bill.\n"
  termsOfService: https://forgesphere.example.com/terms
  title: Cost Anomaly Detector
  version: 1.0.0
servers:
- description: Production Server
  url: https://cost-anomaly.forgesphere.lightning.com/v1
- description: Local Development Server
  url: http://localhost:8155/v1
security:
- bearerAuth: []
tags:
- description: "Detect, list, and analyze cost anomalies."
  name: Anomalies
- description: "Acknowledge, suppress, or investigate anomalies."
  name: Actions
paths:
  /scans:
    post:
      description: "Runs an immediate anomaly detection scan over a specified time\
        \ window. \nNormally scans run automatically every 15 minutes, but this endpoint\
        \ \nforces an ad-hoc scan — useful after a known deployment, during \nincident\
        \ investigation, or before a sales event. Compares current \nspend against\
        \ ML-based seasonal baselines and flags deviations above \nthe threshold.\n"
      operationId: triggerScan
      requestBody:
        content:
          application/json:
            example:
              cloudProviders:
              - AWS
              - GCP
              lookbackHours: 6
              sensitivityLevel: MEDIUM
              includeServices:
              - compute
              - database
              - storage
              - network
              excludeExpectedEvents: true
              correlationWindowMinutes: 30
            schema:
              $ref: "#/components/schemas/TriggerScanRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionScan"
          description: Scan accepted and starting.
          headers:
            Location:
              description: URL to poll for scan status.
              example: /v1/scans/123e4567-e89b-12d3-a456-426614174000
              explode: false
              schema:
                format: uri
                type: string
              style: simple
        "400":
          content:
            application/json:
              example:
                status: 400
                errorCode: VALIDATION_ERROR
                message: cloudProviders must contain at least one valid provider.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/scans
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload or parameters.
        "401":
          content:
            application/json:
              example:
                status: 401
                errorCode: UNAUTHORIZED
                message: Missing or expired authentication token.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/anomalies
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid authentication token.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Scan quota exceeded for this organization.
        "500":
          content:
            application/json:
              example:
                status: 500
                errorCode: BILLING_API_ERROR
                message: Failed to fetch cost data from AWS Cost Explorer. Retrying.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/scans
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected server error.
      summary: Trigger an on-demand cost anomaly detection scan
      tags:
      - Anomalies
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Anomalies
  /scans/{scanId}:
    get:
      description: "Returns the current state of a scan — progress, anomalies detected,\
        \ \ntotal spend in the window, and overall spend delta. Poll this endpoint\
        \ \nuntil status = COMPLETED to get the full anomaly list.\n"
      operationId: getScan
      parameters:
      - description: Unique identifier of the scan.
        example: 123e4567-e89b-12d3-a456-426614174000
        explode: false
        in: path
        name: scanId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Include the full anomaly list in the response.
        example: true
        explode: true
        in: query
        name: includeAnomalies
        required: false
        schema:
          default: true
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionScan"
          description: Scan status and results.
        "401":
          content:
            application/json:
              example:
                status: 401
                errorCode: UNAUTHORIZED
                message: Missing or expired authentication token.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/anomalies
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid authentication token.
        "404":
          content:
            application/json:
              example:
                status: 404
                errorCode: ANOMALY_NOT_FOUND
                message: No anomaly found with ID 456e7890-e89b-12d3-a456-426614174001.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/anomalies/456e7890-e89b-12d3-a456-426614174001
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Scan or anomaly not found.
        "500":
          content:
            application/json:
              example:
                status: 500
                errorCode: BILLING_API_ERROR
                message: Failed to fetch cost data from AWS Cost Explorer. Retrying.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/scans
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected server error.
      summary: Get the status and results of a detection scan
      tags:
      - Anomalies
      x-accepts: application/json
      x-tags:
      - tag: Anomalies
  /anomalies:
    get:
      description: "Returns all cost anomalies detected across the organization. Supports\
        \ \nfiltering by severity, cloud provider, service, team, and time window.\
        \ \nSortable by cost impact, discovery time, or confidence. This is the \n\
        primary \"morning coffee\" view for FinOps teams and engineering leaders.\n"
      operationId: listAnomalies
      parameters:
      - description: Filter by anomaly severity.
        example: HIGH
        explode: true
        in: query
        name: severity
        required: false
        schema:
          enum:
          - INFO
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          type: string
        style: form
      - description: Filter by cloud provider.
        example: AWS
        explode: true
        in: query
        name: cloudProvider
        required: false
        schema:
          enum:
          - AWS
          - GCP
          - AZURE
          - ALL
          type: string
        style: form
      - description: "Filter by cloud service (e.g., compute, database)."
        example: compute
        explode: true
        in: query
        name: service
        required: false
        schema:
          type: string
        style: form
      - description: Filter by owning team.
        example: payments-team
        explode: true
        in: query
        name: team
        required: false
        schema:
          type: string
        style: form
      - description: Filter by anomaly status.
        example: OPEN
        explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - OPEN
          - ACKNOWLEDGED
          - INVESTIGATING
          - RESOLVED
          - SUPPRESSED
          - FALSE_POSITIVE
          type: string
        style: form
      - description: Only include anomalies detected after this time.
        example: 2026-11-20T00:00:00Z
        explode: true
        in: query
        name: fromDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Only include anomalies detected before this time.
        example: 2026-11-24T23:59:59Z
        explode: true
        in: query
        name: toDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Only include anomalies with cost impact above this.
        example: 100.0
        explode: true
        in: query
        name: minCostImpactUSD
        required: false
        schema:
          format: double
          minimum: 0
          type: number
        style: form
      - description: Sort order.
        example: COST_IMPACT
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          default: COST_IMPACT
          enum:
          - COST_IMPACT
          - DETECTED_AT
          - SEVERITY
          - PERCENT_DEVIATION
          type: string
        style: form
      - description: Page number (zero-based).
        example: 0
        explode: true
        in: query
        name: page
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: Number of items per page.
        example: 20
        explode: true
        in: query
        name: size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyList"
          description: Paginated list of cost anomalies.
        "400":
          content:
            application/json:
              example:
                status: 400
                errorCode: VALIDATION_ERROR
                message: cloudProviders must contain at least one valid provider.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/scans
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload or parameters.
        "401":
          content:
            application/json:
              example:
                status: 401
                errorCode: UNAUTHORIZED
                message: Missing or expired authentication token.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/anomalies
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid authentication token.
        "500":
          content:
            application/json:
              example:
                status: 500
                errorCode: BILLING_API_ERROR
                message: Failed to fetch cost data from AWS Cost Explorer. Retrying.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/scans
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected server error.
      summary: List detected cost anomalies
      tags:
      - Anomalies
      x-accepts: application/json
      x-tags:
      - tag: Anomalies
  /anomalies/{anomalyId}:
    get:
      description: "Returns the full analysis of a single anomaly — including resource-level\
        \ \nbreakdown, affected services, probable root cause (deployment, config\
        \ \nchange, traffic surge), attribution to team/cost center, and \nrecommended\
        \ remediation. Includes historical baseline vs actual spend \nchart data.\n"
      operationId: getAnomaly
      parameters:
      - description: Unique identifier of the anomaly.
        example: 456e7890-e89b-12d3-a456-426614174001
        explode: false
        in: path
        name: anomalyId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Include hourly spend timeline for the anomaly window.
        example: true
        explode: true
        in: query
        name: includeTimeline
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - description: Include correlated deployments and config changes.
        example: true
        explode: true
        in: query
        name: includeRelatedChanges
        required: false
        schema:
          default: true
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anomaly"
          description: Anomaly details retrieved successfully.
        "401":
          content:
            application/json:
              example:
                status: 401
                errorCode: UNAUTHORIZED
                message: Missing or expired authentication token.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/anomalies
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid authentication token.
        "404":
          content:
            application/json:
              example:
                status: 404
                errorCode: ANOMALY_NOT_FOUND
                message: No anomaly found with ID 456e7890-e89b-12d3-a456-426614174001.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/anomalies/456e7890-e89b-12d3-a456-426614174001
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Scan or anomaly not found.
        "500":
          content:
            application/json:
              example:
                status: 500
                errorCode: BILLING_API_ERROR
                message: Failed to fetch cost data from AWS Cost Explorer. Retrying.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/scans
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected server error.
      summary: Get detailed root-cause analysis of a cost anomaly
      tags:
      - Anomalies
      x-accepts: application/json
      x-tags:
      - tag: Anomalies
  /anomalies/{anomalyId}/action:
    post:
      description: "Updates the lifecycle state of an anomaly. Actions: ACKNOWLEDGE\
        \ (seen, \nno action yet), INVESTIGATE (assigned to an engineer), RESOLVE\
        \ (fixed, \nwith resolution notes), SUPPRESS (known/expected, future similar\
        \ \nalerts muted), FALSE_POSITIVE (model was wrong). Every action is \naudit-logged\
        \ and feeds the ML model to reduce future false positives.\n"
      operationId: takeAnomalyAction
      parameters:
      - description: Unique identifier of the anomaly.
        example: 456e7890-e89b-12d3-a456-426614174001
        explode: false
        in: path
        name: anomalyId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              action: RESOLVE
              reason: Stopped runaway Lambda recursion; deployed fix via feature flag.
              performedBy: payments-engineer@forgesphere.example.com
              resolutionType: CONFIGURATION_FIX
              actualCostImpactUSD: 12450.0
              preventRecurrence: Added rate limit on Lambda invocation.
            schema:
              $ref: "#/components/schemas/AnomalyActionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Anomaly"
          description: Action recorded and anomaly state updated.
        "400":
          content:
            application/json:
              example:
                status: 400
                errorCode: VALIDATION_ERROR
                message: cloudProviders must contain at least one valid provider.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/scans
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request payload or parameters.
        "401":
          content:
            application/json:
              example:
                status: 401
                errorCode: UNAUTHORIZED
                message: Missing or expired authentication token.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/anomalies
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid authentication token.
        "404":
          content:
            application/json:
              example:
                status: 404
                errorCode: ANOMALY_NOT_FOUND
                message: No anomaly found with ID 456e7890-e89b-12d3-a456-426614174001.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/anomalies/456e7890-e89b-12d3-a456-426614174001
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Scan or anomaly not found.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Anomaly is not in a state that supports this action.
        "500":
          content:
            application/json:
              example:
                status: 500
                errorCode: BILLING_API_ERROR
                message: Failed to fetch cost data from AWS Cost Explorer. Retrying.
                timestamp: 2026-11-24T10:30:00Z
                path: /v1/scans
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected server error.
      summary: "Acknowledge, investigate, resolve, or suppress an anomaly"
      tags:
      - Actions
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Actions
components:
  responses:
    BadRequest:
      content:
        application/json:
          example:
            status: 400
            errorCode: VALIDATION_ERROR
            message: cloudProviders must contain at least one valid provider.
            timestamp: 2026-11-24T10:30:00Z
            path: /v1/scans
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Invalid request payload or parameters.
    Unauthorized:
      content:
        application/json:
          example:
            status: 401
            errorCode: UNAUTHORIZED
            message: Missing or expired authentication token.
            timestamp: 2026-11-24T10:30:00Z
            path: /v1/anomalies
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Missing or invalid authentication token.
    NotFound:
      content:
        application/json:
          example:
            status: 404
            errorCode: ANOMALY_NOT_FOUND
            message: No anomaly found with ID 456e7890-e89b-12d3-a456-426614174001.
            timestamp: 2026-11-24T10:30:00Z
            path: /v1/anomalies/456e7890-e89b-12d3-a456-426614174001
